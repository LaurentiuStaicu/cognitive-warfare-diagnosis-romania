    <title>Figure 5. Carlo M. Cipolla's behavioral matrix in cognitive warfare (Diagnosis of Cognitive Warfare in Romania)</title>
    <meta name="description" content="The primary endogenous cause is the systemic spoliation pressure exerted by internal extractive actors in Quadrant IV (+X, -Y) on the vulnerable citizen in Quadrant II (-X, +Y) on two orthogonal barriers: the vertical extractive dam (blocking horizontal meritocratic mobility to Quadrant I) and the cracked horizontal constitutional and epistemic floor of protection. Against this background of allostatic attrition and legitimate resentment—and in tactical convergence with internal oligarchic factions that encourage anti-institutional chaos to save their impunity before the European rule of law—the intervention of the external catalyst of cognitive warfare exploits hyperbolic discounting of the future (Laibson, 1997) and the diversion of altruistic punishment into symbolic self-destructive revenge and antisocial punishment (spiteful and antisocial punishment; Fehr &amp; Gächter, 2002), pushing the vulnerable citizen vertically down through the cracked floor into Quadrant III of collective self-sabotage (-X, -Y), where his anti-institutional actions simultaneously destroy the public good and his own socioeconomic security; in the mirror, the removal of the extractive dam and the consolidation of the constitutional floor through the architecture of institutional choice (Thaler &amp; Sunstein, 2008) open the restorative trajectory towards Quadrant I of intelligent cooperation (+X, +Y)." />
    <meta name="author" content="Laurențiu Staicu" />
