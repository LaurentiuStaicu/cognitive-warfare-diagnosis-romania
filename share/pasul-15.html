    <title>5.2. The neurobiology of decision making under acute stress and the opposition between the Track A maladaptive reactive loop and the Track B adaptive deliberative pathway (Diagnosis of Cognitive Warfare in Romania)</title>
    <meta name="description" content="Upon impact of an acute crisis stimulus, neurocognitive processing bifurcates between Track A—the reactive loop dominated by the basolateral amygdala, the dopaminergic cognitive tunnel, and the defensively recruited System 1 or System 2—and the adaptive deliberative Track B. In the critical 0–72 hour window, the opening of the coregulatory bridge to Track B—governed by CDC CERC principles (Reynolds &amp; Seeger, 2005) and the negative capability theorized by Bion (1962, 1970)—overcomes mistrust of the mimetic Persona through a polycentric, two-tier de-escalation architecture. The first is the depoliticized technical-evidential level (DNSC, ANCOM, AEP, ONPCSB and the Romanian-Bulgarian regional hub BROD within the European Digital Media Observatory – EDMO, with technical evidence in the STIX standard and mapping on the DISARM matrix), and the second is the level of community and epistemic validators of proximity (doctors, teachers, canonical clerics anchored in proairesis discernment, civic leaders and independent journalists)." />
