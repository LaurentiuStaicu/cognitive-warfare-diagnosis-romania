    <title>Figure 3. The cybernetic and semiotic mechanism of cognitive capture in the sixth operational domain (Diagnosis of Cognitive Warfare in Romania)</title>
    <meta name="description" content="The raw information flow from the Observation phase, polluted with synthetic data in two stages—non-parametric contamination at the time of querying search engines and RAG (inference-time RAG poisoning) systems in the short term, followed by parametric degradation upon retraining (Model Collapse and Model Autophagy Disorder – MAD) in the medium term—and algorithmically amplified by capturing reward prediction error and dopamine D2 receptors, enters the phase of Orientation, where the subject's mental and cultural models are targeted by second-order reflexive control and automated by recommendation algorithms (DRLs), which maintain the target at Rank 0 and Rank 1 reflexivity (Lefebvre, 1982, 2001) and distort precision-weighting (aberrant precision-weighting, Friston, 2010: assigning rigid hyperprecision to conspiratorial belief and mitigating factual prediction errors). This intervention compromises the axiological filter of the first ethical system, blocks the path of ternary mediation and prefrontal rational discernment, and diverts processing down the path of the second ethical system and the binary logic of annihilation. The result is a Decision phase dominated by induced emotional selection, cognitive closure and defensive processing motivated by the protection of group identity, which translates into the Action phase, through complex social contagion on wide bridges (Centola, 2018), in acute social polarization and anti-institutional conflict." />
    <meta name="author" content="Laurențiu Staicu" />
