    <title>Figure 6. Comparative model of cognitive processing in acute crisis: Track A vs. Track B (Diagnosis of Cognitive Warfare in Romania)</title>
    <meta name="description" content="The single upper bifurcation node, triggered by acute stress and polycrisis, divergently separates Track A defensive reactive processing, left, from Track B adaptive deliberative processing, right. On Track A, chronic anxiety, prefrontal inhibition (System 1 under allostatic exhaustion) or motivated rationalization (System 2 hijacked in urban bubbles either to elitist civic secession or to pseudoscientific and revisionist justifications) and the need for cognitive closure (seizing and freezing) push subjects toward the facade conformism of the Mimetic Persona, toward regression into Bion's basic assumptions (baD, baP, baF) and towards the hostile projection of the collective Shadow, in an algorithmic self-amplification loop (R). On Track B—opened at the moment of the acute shock through the CDC CERC institutional calm bridge (Reynolds &amp; Seeger, 2005), the verifiable technical proving ground and the proximity community validators, and stabilized at the population level by allostatic decompression and the technical measures to limit algorithmic amplification in Phase I—processing goes through the five adaptive stages: (1) negative capability (tolerance of uncertainty), (2) reactivation of the System 2 in the mode of actively open-minded thinking to Rank 2 and Rank 3 of reflexivity (Lefebvre), (3) the constructive conversion of the agility of the Trickster archetype, (4) critical discernment in ternary mediation and the constitution of the community as a rational &quot;work group&quot; (Bion, 1961) and (5) sovereign action on the Ego–Self axis." />
