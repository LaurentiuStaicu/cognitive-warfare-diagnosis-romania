    <title>Figure 1. Three-layer causal architecture of endogenous societal vulnerability (Diagnosis of Cognitive Warfare in Romania)</title>
    <meta name="description" content="The structural deficits in Layer A — the lack of public services, the incomplete operational closure of institutions, the precarious socioeconomic environment and the vacuum of political representation (Mair, 2013; Mudde, 2004) — induce in Layer B two complementary regimes of neurocognitive vulnerability that intertwine transversally in society: on the one hand, chronic allostatic stress (flattening the circadian rhythm of cortisol, desensitization of receptors glucocorticoids, systemic inflammation and dendritic retraction in the dlPFC), over which acute shocks add rapid catecholaminergic synaptic inhibition (Arnsten, 2009), switching processing to reactive System 1; on the other hand, the recruitment of an intact biological System 2 in dysrationality and motivated rationalization (Stanovich, 2009; Kahan, 2017) in two symmetrically dysfunctional directions (elitist civic secession in the status bubble or the construction of pseudoscientific, esoteric and radical revisionist rationalizations). Through the three Micro-Macro transformational mechanisms (affective synchronization, complex contagion through wide bridges and opportunistic political intermediation), these processes are sedimented in Layer C in the form of defensive fatalism, learned helplessness and chronic distrust of the constitutional order, offering the vector of cognitive warfare a vulnerable ground that it can directly exploit and amplify." />
    <meta name="author" content="Laurențiu Staicu" />
