    <title>3.1. Bypassing the orientation phase of the OODA loop and compromising the moral filter through second-order reflexive control (Diagnosis of Cognitive Warfare in Romania)</title>
    <meta name="description" content="Cognitive warfare is not limited to fake news in the Observation phase, but targets the center of gravity of the OODA loop: the Orientation phase analyzed by Boyd. Through second-order reflexive control in Lefebvre's sense—automated today by commercial recommendation algorithms—, the operation injects a &quot;predictive shortcut&quot; in terms of active inference (Friston, 2010), which operates by distorting precision-weighting (aberrant precision-weighting), maintains the target at a lower reflexive rank (Rank 0 of direct reaction or Rank 1 of naïve representation, without reaching Rank 2 and Rank 3 of strategic reflexivity) and a switch from the first ethical system of procedural cooperation and self-criticism to the second ethical system of confrontation and annihilation." />
