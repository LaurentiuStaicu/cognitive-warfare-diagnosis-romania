    <title>1.3. Demographic faults, allostatic load and population neurocognitive vulnerability (Diagnosis of Cognitive Warfare in Romania)</title>
    <meta name="description" content="The polarization between metropolitan and peripheral Romania, massive emigration and chronic insecurity transversely make the decision-making architecture vulnerable through two neurocognitive regimes that intertwine in society: under the pressure of precariousness and bureaucratic humiliation, chronic allostatic load (flattening of the circadian curve of cortisol, desensitization of glucocorticoid receptors, systemic inflammation and dendritic retraction in the dlPFC) forces the switch to the reactive System 1, while in urban environments with high formal education, in addition to episodes of executive burnout, the absence of actively open thinking diverts System 2 into irrationality and motivated rationalization (myside bias) — either for the elitist justification of civic secession, or for the elaboration of pseudoscientific and radical-revisionist rationalizations. This neurocognitive state becomes political vulnerability when traditional democratic parties generate a vacuum of representation (Mair, 2013), which opportunistic political actors (Mudde, 2004) and external operations of reflexive control directly exploit." />
